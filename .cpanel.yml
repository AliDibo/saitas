---
# cPanel Git Version Control deploy ayarı ("Deploy HEAD Commit").
# Sitenin klasörü (Belge Kökü): $HOME/saitas.com.tr
#
# - Repo zaten bu klasöre klonlandıysa hiçbir şey kopyalanmaz: "Update from Remote"
#   siteyi zaten günceller, Deploy'a gerek yoktur.
# - Repo başka bir klasördeyse site dosyaları SADECE bu klasöre kopyalanır.
# - Hedef klasör yoksa hiçbir şey yapılmaz (klasör oluşturulmaz). public_html'e
#   ya da başka bir siteye ASLA dokunulmaz.
# Köke yeni bir site dosyası eklenirse (ör. robots.txt) FILES satırına da ekle.
deployment:
  tasks:
    - export TARGET=$HOME/saitas.com.tr
    - export FILES="index.html feedback.php words.txt kural.txt .htaccess css js images"
    - 'if [ ! -d "$TARGET" ]; then echo "Hedef klasor yok: $TARGET - hicbir sey kopyalanmadi"; elif [ "$(pwd -P)" = "$(cd "$TARGET" && pwd -P)" ]; then echo "Repo zaten site klasorunde - kopyalama gerekmiyor"; else /bin/cp -R $FILES "$TARGET/" && echo "Kopyalandi: $TARGET"; fi'
